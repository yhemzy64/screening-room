<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Screening Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body{ font-family:'Inter', sans-serif; }
  .spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body class="bg-[#141310]">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// ---- Supabase project config (safe to expose client-side) ----
const SUPABASE_URL = "https://gaqhhmfpnznyliqwbtzk.supabase.co";
const SUPABASE_KEY = "sb_publishable_q5rJuj4JOFt_7Of1qnVd0w_a6NT2wkI";
const BUCKET = "media";

async function sendOtp(email) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ email, create_user: true }),
  });
  if (!res.ok) throw new Error("Could not send code. Check the email and try again.");
}

async function verifyOtp(email, token) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ email, token, type: "email" }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error_description || data?.msg || "Invalid or expired code.");
  return data;
}

async function uploadToBucket(file, accessToken, path) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(path)}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}`, "Content-Type": file.type || "application/octet-stream" },
    body: file,
  });
  if (!res.ok) { const data = await res.json().catch(() => ({})); throw new Error(data?.message || "Upload failed."); }
}

async function listBucket(accessToken) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix: "", limit: 100, sortBy: { column: "created_at", order: "desc" } }),
  });
  if (!res.ok) return [];
  return res.json();
}

function publicUrl(path) { return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(path)}`; }
function guessType(name) {
  const ext = name.split(".").pop().toLowerCase();
  return ["mp4","mov","webm","m4v","avi"].includes(ext) ? "video" : "photo";
}
function parseFileName(name) {
  const parts = name.split("__");
  if (parts.length >= 3 && parts[0].startsWith("by_")) {
    const uploader = parts[0].slice(3).replace(/_at_/g, "@").replace(/_dot_/g, ".");
    const title = parts.slice(2).join("__").replace(/\.[^/.]+$/, "");
    return { uploader, title };
  }
  return { uploader: "Member", title: name.replace(/\.[^/.]+$/, "") };
}
function sanitizeEmail(email) { return email.replace("@", "_at_").replace(/\./g, "_dot_"); }

function Spinner() { return <span className="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full spin" />; }

function GateScreen({ onAuthed }) {
  const [step, setStep] = useState("email");
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const requestCode = async (e) => {
    e.preventDefault();
    if (!email.includes("@")) { setError("Enter a valid email."); return; }
    setLoading(true); setError("");
    try { await sendOtp(email); setStep("code"); }
    catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  const confirmCode = async (e) => {
    e.preventDefault();
    if (code.trim().length === 0) { setError("Enter the code from your email."); return; }
    setLoading(true); setError("");
    try { const data = await verifyOtp(email, code.trim()); onAuthed({ accessToken: data.access_token, email }); }
    catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6] flex items-center justify-center px-6">
      <div className="max-w-sm w-full text-center">
        <div className="text-3xl mb-6">🎬</div>
        <h1 className="font-black text-4xl tracking-tight mb-2" style={{fontFamily:"'Bebas Neue', sans-serif", letterSpacing:"0.03em"}}>THE SCREENING ROOM</h1>
        <p className="text-sm text-[#A8A08E] mb-10">Private reels &amp; photos, shared by invitation only.</p>

        {step === "email" && (
          <form onSubmit={requestCode} className="space-y-3">
            <input value={email} onChange={(e)=>setEmail(e.target.value)} type="email" placeholder="you@email.com"
              className="w-full bg-[#1D1B16] border border-[#332F26] rounded-sm py-3 px-4 text-sm placeholder-[#6B6355] focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />
            {error && <p className="text-xs text-[#C4685A] text-left pl-1">{error}</p>}
            <button type="submit" disabled={loading} className="w-full bg-[#E3A335] hover:bg-[#f0b14a] disabled:opacity-60 text-[#141310] font-semibold text-sm rounded-sm py-3 flex items-center justify-center gap-2">
              {loading ? <Spinner/> : "Send me a code →"}
            </button>
          </form>
        )}

        {step === "code" && (
          <form onSubmit={confirmCode} className="space-y-3">
            <p className="text-xs text-[#A8A08E] -mt-2 mb-2">Sent a 6-digit code to {email}</p>
            <input value={code} onChange={(e)=>setCode(e.target.value)} type="text" placeholder="123456"
              className="w-full bg-[#1D1B16] border border-[#332F26] rounded-sm py-3 px-4 text-sm placeholder-[#6B6355] focus:outline-none focus:ring-1 focus:ring-[#E3A335] tracking-widest" />
            {error && <p className="text-xs text-[#C4685A] text-left pl-1">{error}</p>}
            <button type="submit" disabled={loading} className="w-full bg-[#E3A335] hover:bg-[#f0b14a] disabled:opacity-60 text-[#141310] font-semibold text-sm rounded-sm py-3 flex items-center justify-center gap-2">
              {loading ? <Spinner/> : "Enter screening room →"}
            </button>
            <button type="button" onClick={()=>{setStep("email"); setError("");}} className="text-xs text-[#6B6355] hover:text-[#E3A335]">Use a different email</button>
          </form>
        )}
      </div>
    </div>
  );
}

function UploadModal({ onClose, onDone, accessToken, email }) {
  const [dragOver, setDragOver] = useState(false);
  const [pending, setPending] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const inputRef = useRef(null);

  const handleFiles = useCallback((fileList) => {
    const files = Array.from(fileList).map((f) => ({
      id: Math.random().toString(36).slice(2), file: f, type: guessType(f.name),
      url: URL.createObjectURL(f), title: f.name.replace(/\.[^/.]+$/, ""),
    }));
    setPending((p) => [...p, ...files]);
  }, []);

  const publish = async () => {
    if (pending.length === 0) return;
    setUploading(true); setError("");
    try {
      for (const p of pending) {
        const path = `by_${sanitizeEmail(email)}__${Date.now()}__${p.file.name.replace(/\s+/g, "_")}`;
        await uploadToBucket(p.file, accessToken, path);
      }
      onDone(); onClose();
    } catch (err) { setError(err.message); }
    finally { setUploading(false); }
  };

  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-4">
      <div className="bg-[#1D1B16] border border-[#332F26] rounded-sm w-full max-w-lg max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between px-6 py-4 border-b border-[#332F26]">
          <h2 className="text-[#EDE6D6] font-semibold text-sm">Add to the reel</h2>
          <button onClick={onClose} className="text-[#A8A08E]">✕</button>
        </div>
        <div className="p-6">
          <div onDragOver={(e)=>{e.preventDefault(); setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
            onDrop={(e)=>{e.preventDefault(); setDragOver(false); if(e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files);}}
            onClick={()=>inputRef.current?.click()}
            className={`border border-dashed rounded-sm py-12 flex flex-col items-center justify-center gap-3 cursor-pointer ${dragOver?"border-[#E3A335] bg-[#E3A335]/5":"border-[#4A4436]"}`}>
            <div className="text-2xl">⬆️</div>
            <p className="text-sm text-[#EDE6D6]">Tap to choose photos or videos</p>
            <input ref={inputRef} type="file" accept="video/*,image/*" multiple className="hidden" onChange={(e)=>e.target.files && handleFiles(e.target.files)} />
          </div>
          {pending.length > 0 && (
            <div className="mt-5 space-y-2">
              {pending.map((p)=>(
                <div key={p.id} className="flex items-center gap-3 bg-[#141310] rounded-sm px-3 py-2 border border-[#2A271F]">
                  <span>{p.type==="video"?"🎞️":"🖼️"}</span>
                  <span className="text-xs text-[#EDE6D6] truncate flex-1">{p.title}</span>
                  <button onClick={()=>setPending((cur)=>cur.filter((x)=>x.id!==p.id))} className="text-[#6B6355]">✕</button>
                </div>
              ))}
            </div>
          )}
          {error && <p className="text-xs text-[#C4685A] mt-4">{error}</p>}
          <button onClick={publish} disabled={pending.length===0||uploading} className="w-full mt-6 bg-[#E3A335] hover:bg-[#f0b14a] disabled:bg-[#332F26] disabled:text-[#6B6355] text-[#141310] font-semibold text-sm rounded-sm py-3 flex items-center justify-center gap-2">
            {uploading ? <><Spinner/> Uploading…</> : `Publish ${pending.length>0?`(${pending.length})`:""}`}
          </button>
        </div>
      </div>
    </div>
  );
}

function PlayerModal({ item, onClose }) {
  return (
    <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center px-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-5 right-5 text-[#EDE6D6] text-xl">✕</button>
      <div className="max-w-3xl w-full" onClick={(e)=>e.stopPropagation()}>
        {item.type==="video" ? <video src={item.url} controls autoPlay className="w-full rounded-sm max-h-[75vh]" />
          : <img src={item.url} alt={item.title} className="w-full rounded-sm max-h-[75vh] object-contain" />}
        <div className="mt-4">
          <h3 className="text-[#EDE6D6] font-semibold">{item.title}</h3>
          <p className="text-xs text-[#A8A08E]">Uploaded by {item.uploader}</p>
        </div>
      </div>
    </div>
  );
}

function LibraryCard({ item, onOpen }) {
  return (
    <button onClick={()=>onOpen(item)} className="text-left bg-[#1D1B16] border border-[#2A271F] rounded-sm overflow-hidden">
      <div className="relative aspect-video bg-neutral-900">
        {item.type==="photo" && <img src={item.url} alt={item.title} className="absolute inset-0 w-full h-full object-cover" />}
        {item.type==="video" && <video src={item.url} className="absolute inset-0 w-full h-full object-cover" muted />}
        <span className="absolute top-2 left-2 bg-[#141310]/70 rounded-sm px-1.5 py-1 text-xs">{item.type==="video"?"🎞️":"🖼️"}</span>
      </div>
      <div className="p-3">
        <h3 className="text-[#EDE6D6] text-sm font-medium truncate">{item.title}</h3>
        <p className="text-[11px] text-[#6B6355] mt-0.5">{item.uploader}</p>
      </div>
    </button>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [library, setLibrary] = useState([]);
  const [loadingLibrary, setLoadingLibrary] = useState(false);
  const [filter, setFilter] = useState("all");
  const [showUpload, setShowUpload] = useState(false);
  const [openItem, setOpenItem] = useState(null);

  const refreshLibrary = useCallback(async (accessToken) => {
    setLoadingLibrary(true);
    try {
      const objects = await listBucket(accessToken);
      const items = (objects||[]).filter(o=>o.name&&o.id).map(o=>{
        const { uploader, title } = parseFileName(o.name);
        return { id:o.id, type:guessType(o.name), title, uploader, url:publicUrl(o.name) };
      });
      setLibrary(items);
    } finally { setLoadingLibrary(false); }
  }, []);

  useEffect(() => { if (session) refreshLibrary(session.accessToken); }, [session, refreshLibrary]);

  const filtered = library.filter((i) => filter === "all" || i.type === filter);
  if (!session) return <GateScreen onAuthed={setSession} />;

  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6]">
      <header className="sticky top-0 z-30 bg-[#141310]/90 backdrop-blur-sm border-b border-[#2A271F]">
        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <span className="font-black tracking-tight text-lg" style={{fontFamily:"'Bebas Neue', sans-serif"}}>🎬 THE SCREENING ROOM</span>
          <button onClick={()=>setShowUpload(true)} className="bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] text-xs font-semibold rounded-sm px-3.5 py-2">⬆️ Upload</button>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-6 py-10">
        <p className="text-[#E3A335] text-xs uppercase tracking-widest mb-1">Now showing</p>
        <h1 className="text-3xl font-black tracking-tight mb-6" style={{fontFamily:"'Bebas Neue', sans-serif"}}>{library.length} REELS &amp; PHOTOS</h1>
        <div className="flex gap-2 mb-6">
          {["all","video","photo"].map((f)=>(
            <button key={f} onClick={()=>setFilter(f)} className={`text-xs rounded-sm px-3 py-1.5 border ${filter===f?"bg-[#E3A335] text-[#141310] border-[#E3A335]":"border-[#332F26] text-[#A8A08E]"}`}>
              {f==="all"?"All":f==="video"?"Videos":"Photos"}
            </button>
          ))}
        </div>
        {loadingLibrary && <p className="text-center text-[#6B6355] text-sm py-16">Loading…</p>}
        {!loadingLibrary && (
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
            {filtered.map((item)=><LibraryCard key={item.id} item={item} onOpen={setOpenItem} />)}
          </div>
        )}
        {!loadingLibrary && filtered.length===0 && <p className="text-center text-[#6B6355] text-sm py-16">Nothing here yet — upload the first one.</p>}
      </main>
      {showUpload && <UploadModal onClose={()=>setShowUpload(false)} onDone={()=>refreshLibrary(session.accessToken)} accessToken={session.accessToken} email={session.email} />}
      {openItem && <PlayerModal item={openItem} onClose={()=>setOpenItem(null)} />}
      <footer className="border-t border-[#2A271F] py-8 text-center">
        <a href="mailto:yhemzy64@gmail.com" className="text-xs text-[#6B6355]">yhemzy64@gmail.com</a>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// ---- Supabase project config (safe to expose client-side) ----
const SUPABASE_URL = "https://gaqhhmfpnznyliqwbtzk.supabase.co";
const SUPABASE_KEY = "sb_publishable_q5rJuj4JOFt_7Of1qnVd0w_a6NT2wkI";
const BUCKET = "media";

// Change this to whatever you want your admin password to be.
const ADMIN_PASSWORD = "reel2026";

// ---- Supabase Storage REST helpers (anon key, no login flow) ----
async function uploadToBucket(fileOrBlob, path, contentType) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(path)}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": contentType || fileOrBlob.type || "application/octet-stream" },
    body: fileOrBlob,
  });
  if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d?.message || "Upload failed."); }
}

async function deleteFromBucket(paths) {
  await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
    method: "DELETE",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefixes: paths }),
  });
}

async function listBucket() {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix: "", limit: 500, sortBy: { column: "created_at", order: "desc" } }),
  });
  if (!res.ok) return [];
  return res.json();
}

function publicUrl(path) { return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(path)}`; }
function guessType(name) {
  const ext = name.split(".").pop().toLowerCase();
  return ["mp4","mov","webm","m4v","avi"].includes(ext) ? "video" : "photo";
}

async function fetchLibrary() {
  const objects = await listBucket();
  const metaFiles = (objects || []).filter(o => o.name && o.name.endsWith("__meta.json"));
  const items = await Promise.all(metaFiles.map(async (o) => {
    try {
      const res = await fetch(publicUrl(o.name));
      const meta = await res.json();
      return meta;
    } catch (e) { return null; }
  }));
  return items.filter(Boolean).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
}

async function addItem({ title, creator, year, category, featured, description, mediaFile, thumbFile }, onProgress) {
  const id = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const mediaExt = mediaFile.name.split(".").pop();
  const mediaPath = `${id}__media.${mediaExt}`;
  onProgress && onProgress("Uploading file…");
  await uploadToBucket(mediaFile, mediaPath);

  let thumbPath = null;
  if (thumbFile) {
    const thumbExt = thumbFile.name.split(".").pop();
    thumbPath = `${id}__thumb.${thumbExt}`;
    onProgress && onProgress("Uploading thumbnail…");
    await uploadToBucket(thumbFile, thumbPath);
  }

  const meta = {
    id, title, creator: creator || "", year: year || "", category: category || "Movies",
    featured: !!featured, description: description || "",
    type: guessType(mediaFile.name), mediaPath, thumbPath, createdAt: Date.now(),
  };
  onProgress && onProgress("Saving details…");
  const metaBlob = new Blob([JSON.stringify(meta)], { type: "application/json" });
  await uploadToBucket(metaBlob, `${id}__meta.json`, "application/json");
  return meta;
}

async function removeItem(item) {
  const paths = [`${item.id}__meta.json`, item.mediaPath];
  if (item.thumbPath) paths.push(item.thumbPath);
  await deleteFromBucket(paths);
}

async function getComments(itemId) {
  try {
    const res = await fetch(publicUrl(`${itemId}__comments.json`) + `?t=${Date.now()}`);
    if (!res.ok) return [];
    return await res.json();
  } catch (e) { return []; }
}

async function addComment(itemId, name, text) {
  const existing = await getComments(itemId);
  const updated = [...existing, { name: name || "Anonymous", text, createdAt: Date.now() }];
  const blob = new Blob([JSON.stringify(updated)], { type: "application/json" });
  await uploadToBucket(blob, `${itemId}__comments.json`, "application/json");
  return updated;
}

// ---- Football Predictions ----
function generatePrediction(teamA, teamB) {
  const openers = [
    `${teamA} come into this one full of confidence`, `It's anyone's game, but ${teamA} have the edge on paper`,
    `${teamB} will be looking to spring a surprise here`, `This has all the makings of a tight, tense encounter`,
  ];
  const middles = [
    `expect a battle in midfield with chances at both ends`, `set pieces could be the difference-maker`,
    `home advantage might tip the scales`, `fitness and form will decide who takes it`,
  ];
  const closers = [
    `Prediction: ${teamA} edge it 2-1.`, `Prediction: tight one, ${teamB} sneak a 1-0 win.`,
    `Prediction: goals at both ends, 2-2 draw.`, `Prediction: ${teamA} to win comfortably, 3-1.`,
  ];
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  return `${pick(openers)} — ${pick(middles)}. ${pick(closers)} (Just for fun, not real betting advice!)`;
}

async function fetchPredictions() {
  const objects = await listBucket();
  const files = (objects || []).filter(o => o.name && o.name.endsWith("__prediction.json"));
  const items = await Promise.all(files.map(async (o) => {
    try { return await (await fetch(publicUrl(o.name))).json(); } catch (e) { return null; }
  }));
  return items.filter(Boolean).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
}

async function generateLivePredictions() {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/generate-predictions`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({}),
  });
  if (!res.ok) throw new Error("Could not fetch live predictions.");
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  const preds = data.predictions || [];
  for (const p of preds) { await savePrediction(p); }
  return preds;
}

async function savePrediction(pred) {
  const blob = new Blob([JSON.stringify(pred)], { type: "application/json" });
  await uploadToBucket(blob, `${pred.id}__prediction.json`, "application/json");
}

async function deletePrediction(pred) {
  await deleteFromBucket([`${pred.id}__prediction.json`]);
}

// ---- Novels ----
async function fetchNovels() {
  const objects = await listBucket();
  const files = (objects || []).filter(o => o.name && o.name.endsWith("__novel.json"));
  const items = await Promise.all(files.map(async (o) => {
    try { return await (await fetch(publicUrl(o.name))).json(); } catch (e) { return null; }
  }));
  return items.filter(Boolean).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
}

async function saveNovel(novel) {
  const blob = new Blob([JSON.stringify(novel)], { type: "application/json" });
  await uploadToBucket(blob, `${novel.id}__novel.json`, "application/json");
}

async function deleteNovel(novel) {
  await deleteFromBucket([`${novel.id}__novel.json`]);
}

function MediaThumb({ item, className }) {
  if (item.thumbPath || item.type === "photo") {
    return <img src={publicUrl(item.thumbPath || item.mediaPath)} className={className} onError={(e)=>{e.target.style.display='none';}} />;
  }
  // Video with no custom thumbnail — show a clean placeholder instead of a broken image
  return (
    <div className={`${className} flex items-center justify-center bg-gradient-to-br from-[#2A271F] to-[#141310]`}>
      <span className="text-2xl">🎞️</span>
    </div>
  );
}

function Spinner() { return <span className="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full spin" />; }

// ---------------- Admin gate ----------------
function AdminGate({ onUnlock, onBack }) {
  const [pw, setPw] = useState("");
  const [error, setError] = useState("");
  const submit = (e) => {
    e.preventDefault();
    if (pw === ADMIN_PASSWORD) onUnlock();
    else setError("Wrong password.");
  };
  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6] flex items-center justify-center px-6">
      <div className="max-w-sm w-full text-center">
        <div className="text-3xl mb-6">🔒</div>
        <h1 className="serif text-2xl mb-1">Admin Access</h1>
        <p className="text-xs text-[#A8A08E] uppercase tracking-widest mb-8">The Screening Room</p>
        <form onSubmit={submit} className="space-y-3">
          <input value={pw} onChange={(e)=>setPw(e.target.value)} type="password" placeholder="Enter admin password"
            className="w-full bg-[#1D1B16] border border-[#E3A335]/60 rounded-sm py-3 px-4 text-sm placeholder-[#6B6355] focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />
          {error && <p className="text-xs text-[#C4685A]">{error}</p>}
          <button type="submit" className="w-full bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] font-semibold text-sm rounded-sm py-3">Enter Dashboard</button>
        </form>
        <button onClick={onBack} className="text-xs text-[#6B6355] hover:text-[#E3A335] mt-8">← Back to site</button>
      </div>
    </div>
  );
}

// ---------------- Admin dashboard ----------------
function AdminDashboard({ items, onBack, onRefresh }) {
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [status, setStatus] = useState("");
  const [error, setError] = useState("");
  const [form, setForm] = useState({ title:"", creator:"", year:"", category:"Movies", featured:false, description:"" });
  const mediaRef = useRef(null);
  const thumbRef = useRef(null);
  const [mediaFile, setMediaFile] = useState(null);
  const [thumbFile, setThumbFile] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    if (!form.title || !mediaFile) { setError("Title and a media file are required."); return; }
    setSaving(true); setError("");
    try {
      await addItem({ ...form, mediaFile, thumbFile }, setStatus);
      setShowForm(false);
      setForm({ title:"", creator:"", year:"", category:"Movies", featured:false, description:"" });
      setMediaFile(null); setThumbFile(null);
      onRefresh();
    } catch (err) {
      setError(err.message);
    } finally {
      setSaving(false); setStatus("");
    }
  };

  const del = async (item) => {
    if (!confirm(`Delete "${item.title}"?`)) return;
    await removeItem(item);
    onRefresh();
  };

  const featuredCount = items.filter(i => i.featured).length;
  const categories = new Set(items.map(i => i.category)).size;

  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6]">
      <header className="border-b border-[#2A271F] px-6 py-4 flex items-center justify-between">
        <span className="display text-lg text-[#E3A335]">THE SCREENING ROOM <span className="text-[#6B6355] text-xs align-middle">ADMIN</span></span>
        <button onClick={onBack} className="text-xs text-[#A8A08E] hover:text-[#E3A335]">View site →</button>
      </header>

      <main className="max-w-3xl mx-auto px-6 py-8">
        <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
          <div>
            <h1 className="serif text-3xl">Admin Dashboard</h1>
            <p className="text-xs text-[#A8A08E] uppercase tracking-widest">Manage your library</p>
          </div>
          <button onClick={()=>setShowForm(true)} className="bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] text-xs font-semibold rounded-sm px-4 py-2.5">+ Add item</button>
        </div>

        <div className="grid grid-cols-2 gap-3 mb-8">
          <div className="bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4">
            <p className="text-xs text-[#A8A08E] uppercase tracking-widest mb-1">Total items</p>
            <p className="text-3xl serif">{items.length}</p>
          </div>
          <div className="bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4">
            <p className="text-xs text-[#A8A08E] uppercase tracking-widest mb-1">Featured</p>
            <p className="text-3xl serif">{featuredCount}</p>
          </div>
        </div>

        <div className="space-y-2">
          {items.map((item) => (
            <div key={item.id} className="flex items-center gap-3 bg-[#1D1B16] border border-[#2A271F] rounded-sm p-3">
              <div className="w-14 h-14 rounded-sm overflow-hidden bg-neutral-900 shrink-0">
                <MediaThumb item={item} className="w-full h-full object-cover" />
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium truncate">{item.title}</p>
                <p className="text-xs text-[#A8A08E] truncate">{item.creator} {item.featured ? "· Featured" : ""}</p>
              </div>
              <button onClick={()=>del(item)} className="text-[#C4685A] text-xs">Delete</button>
            </div>
          ))}
          {items.length === 0 && <p className="text-center text-[#6B6355] text-sm py-10">No items yet — add your first one.</p>}
        </div>
      </main>

      {showForm && (
        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-4">
          <div className="bg-[#1D1B16] border border-[#332F26] rounded-sm w-full max-w-lg max-h-[88vh] overflow-y-auto">
            <div className="flex items-center justify-between px-6 py-4 border-b border-[#332F26]">

            </div>
            <form onSubmit={submit} className="p-6 space-y-4">
              <div>
                <label className="text-xs text-[#A8A08E] uppercase tracking-widest">Title *</label>
                <input value={form.title} onChange={(e)=>setForm({...form, title:e.target.value})} className="w-full mt-1 bg-[#141310] border border-[#332F26] rounded-sm py-2.5 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" placeholder="Video title" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-[#A8A08E] uppercase tracking-widest">Creator</label>
                  <input value={form.creator} onChange={(e)=>setForm({...form, creator:e.target.value})} className="w-full mt-1 bg-[#141310] border border-[#332F26] rounded-sm py-2.5 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" placeholder="Name" />
                </div>
                <div>

              <div>

                <textarea value={form.description} onChange={(e)=>setForm({...form, description:e.target.value})} rows="2" className="w-full mt-1 bg-[#141310] border border-[#332F26] rounded-sm py-2.5 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" placeholder="Short description..." />
              </div>
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={form.featured} onChange={(e)=>setForm({...form, featured:e.target.checked})} />
                Featured (shows in the spotlight banner)
              </label>

              <div>
                <label className="text-xs text-[#A8A08E] uppercase tracking-widest">Video or photo file *</label>
                <div onClick={()=>mediaRef.current?.click()} className="mt-1 border border-dashed border-[#4A4436] rounded-sm py-6 flex flex-col items-center justify-center gap-1 cursor-pointer">
                  <span>🎞️</span>
                  <span className="text-xs text-[#EDE6D6]">{mediaFile ? mediaFile.name : "Tap to choose from your phone"}</span>
                  <input ref={mediaRef} type="file" accept="video/*,image/*" className="hidden" onChange={(e)=>setMediaFile(e.target.files[0])} />

              <div>

              {error && <p className="text-xs text-[#C4685A]">{error}</p>}

                {saving ? <><Spinner/> {status || "Saving…"}</> : "Publish"}

function PlayerModal({ item, onClose }) {

  const [loadingComments, setLoadingComments] = useState(true);
  const [name, setName] = useState("");
  const [text, setText] = useState("");
  const [posting, setPosting] = useState(false);

    let alive = true;
    getComments(item.id).then((c) => { if (alive) { setComments(c); setLoadingComments(false); } });
    return () => { alive = false; };
  }, [item.id]);

  const submitComment = async (e) => {
    e.preventDefault();
    if (!text.trim()) return;
    setPosting(true);
    try {
      const updated = await addComment(item.id, name.trim(), text.trim());
      setComments(updated);
      setText("");
    } finally {
      setPosting(false);

  return (
    <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center px-4 overflow-y-auto py-8" onClick={onClose}>

          : <img src={publicUrl(item.mediaPath)} alt={item.title} className="w-full rounded-sm max-h-[75vh] object-contain" />}

            <p className="text-xs text-[#A8A08E]">{item.creator} {item.year ? `· ${item.year}` : ""} · {item.category}</p>

          <a href={publicUrl(item.mediaPath)} download className="shrink-0 bg-[#1D1B16] border border-[#332F26] hover:border-[#E3A335] text-[#EDE6D6] text-xs rounded-sm px-3 py-2 whitespace-nowrap">⬇ Download</a>

                <div key={i} className="text-sm">

            <div className="flex gap-2">

                className="flex-1 bg-[#1D1B16] border border-[#332F26] rounded-sm py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />

}

function Card({ item, onOpen }) {
  return (
    <button onClick={()=>onOpen(item)} className="text-left bg-[#1D1B16] border border-[#2A271F] rounded-sm overflow-hidden hover:border-[#E3A335]/50 transition">
      <div className="relative aspect-video bg-neutral-900">
        <MediaThumb item={item} className="absolute inset-0 w-full h-full object-cover" />
        {item.featured && <span className="absolute top-2 right-2 bg-[#141310]/80 text-[#E3A335] text-[10px] uppercase tracking-widest rounded-sm px-2 py-1">Featured</span>}
        {item.type==="video" && <span className="absolute top-2 left-2 bg-[#141310]/70 rounded-sm px-1.5 py-1 text-xs">🎞️</span>}
      </div>
      <div className="p-3">
        <h3 className="serif text-sm truncate">{item.title}</h3>
        <p className="text-[11px] text-[#6B6355] mt-0.5">{item.creator}{item.year ? ` · ${item.year}` : ""}</p>
      </div>
    </button>
  );
}

function PublicSite({ items, onOpenAdmin, theme, onToggleTheme, onOpenPredictions, onOpenNovels }) {
  const [query, setQuery] = useState("");
  const [openItem, setOpenItem] = useState(null);
  const featured = items.find(i => i.featured);
  const filtered = items.filter(i => i.title.toLowerCase().includes(query.toLowerCase()));

  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6]">
      <header className="border-b border-[#2A271F] px-6 py-4 flex items-center justify-between flex-wrap gap-3">
        <span className="display text-lg text-[#E3A335]">THE SCREENING ROOM</span>
        <nav className="flex items-center gap-4 text-xs">
          <button onClick={onOpenPredictions} className="text-[#6B6355] hover:text-[#E3A335]">⚽ Predictions</button>
          <button onClick={onOpenNovels} className="text-[#6B6355] hover:text-[#E3A335]">📖 Novels</button>
          <button onClick={onToggleTheme} className="text-[#6B6355] hover:text-[#E3A335]">
            {theme === "dark" ? "☀ Light" : "🌙 Dark"}
          </button>
          <button onClick={onOpenAdmin} className="text-[#6B6355] hover:text-[#E3A335]">Admin</button>
        </nav>
      </header>

      {featured && (
        <div className="relative h-[50vh] min-h-[320px] flex items-end p-6" onClick={()=>setOpenItem(featured)}>
          <MediaThumb item={featured} className="absolute inset-0 w-full h-full object-cover" />
          <div className="absolute inset-0 bg-gradient-to-t from-[#141310] via-[#141310]/60 to-transparent" />
          <div className="relative z-10 max-w-lg">
            <span className="text-[10px] uppercase tracking-widest text-[#E3A335] border border-[#E3A335] rounded-sm px-2 py-1">Featured</span>
            <h1 className="serif text-4xl mt-3 mb-2">{featured.title}</h1>
            {featured.description && <p className="text-sm text-[#A8A08E] mb-4 line-clamp-2">{featured.description}</p>}
            <button className="bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] font-semibold text-sm rounded-sm px-4 py-2.5">▶ Watch now</button>
          </div>
        </div>
      )}

      <main className="max-w-5xl mx-auto px-6 py-8">
        <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="Search videos & photos..."
          className="w-full bg-[#1D1B16] border border-[#332F26] rounded-sm py-2.5 px-4 text-sm mb-6 focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />
        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
          {filtered.map((item) => <Card key={item.id} item={item} onOpen={setOpenItem} />)}
        </div>
        {filtered.length === 0 && <p className="text-center text-[#6B6355] text-sm py-16">Nothing here yet.</p>}
      </main>

      {openItem && <PlayerModal item={openItem} onClose={()=>setOpenItem(null)} />}

      <footer className="border-t border-[#2A271F] py-8 text-center">
        <a href="mailto:yhemzy64@gmail.com" className="text-xs text-[#6B6355]">yhemzy64@gmail.com</a>
      </footer>
    </div>
  );
}

function PredictionsPage({ onBack, isAdmin }) {
  const [predictions, setPredictions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [teamA, setTeamA] = useState("");
  const [teamB, setTeamB] = useState("");
  const [date, setDate] = useState("");
  const [generatingLive, setGeneratingLive] = useState(false);
  const [liveError, setLiveError] = useState("");

  const refresh = useCallback(async () => {
    setLoading(true);
    try { setPredictions(await fetchPredictions()); } finally { setLoading(false); }
  }, []);
  useEffect(() => { refresh(); }, [refresh]);

  const getLivePredictions = async () => {
    setGeneratingLive(true); setLiveError("");
    try {
      await generateLivePredictions();
      await refresh();
    } catch (err) {
      setLiveError(err.message);
    } finally {
      setGeneratingLive(false);
    }
  };

  const add = async (e) => {
    e.preventDefault();
    if (!teamA || !teamB) return;
    const pred = {
      id: `${Date.now()}_${Math.random().toString(36).slice(2,8)}`,
      teamA, teamB, date,
      text: generatePrediction(teamA, teamB),
      createdAt: Date.now(),
    };
    await savePrediction(pred);
    setTeamA(""); setTeamB(""); setDate("");
    refresh();
  };

  const editText = async (pred, newText) => {
    const updated = { ...pred, text: newText };
    await savePrediction(updated);
    refresh();
  };

  const remove = async (pred) => { await deletePrediction(pred); refresh(); };

  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6]">
      <header className="border-b border-[#2A271F] px-6 py-4 flex items-center justify-between">
        <span className="display text-lg text-[#E3A335]">⚽ FOOTBALL PREDICTIONS</span>
        <button onClick={onBack} className="text-xs text-[#6B6355] hover:text-[#E3A335]">← Back to site</button>
      </header>
      <main className="max-w-2xl mx-auto px-6 py-8">
        <p className="text-xs text-[#A8A08E] mb-6">Fun, AI-flavored predictions for entertainment only — not real betting advice.</p>

        {isAdmin && (
          <div className="mb-6">
            <button onClick={getLivePredictions} disabled={generatingLive} className="w-full bg-[#E3A335] hover:bg-[#f0b14a] disabled:opacity-60 text-[#141310] text-sm font-semibold rounded-sm py-3 flex items-center justify-center gap-2">
              {generatingLive ? <><Spinner/> Fetching real matches & generating…</> : "⚡ Get Live Predictions (real matches + AI)"}
            </button>
            {liveError && <p className="text-xs text-[#C4685A] mt-2">{liveError}</p>}
          </div>
        )}

        {isAdmin && (
          <form onSubmit={add} className="bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4 mb-6 space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <input value={teamA} onChange={(e)=>setTeamA(e.target.value)} placeholder="Team A" className="bg-[#141310] border border-[#332F26] rounded-sm py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />
              <input value={teamB} onChange={(e)=>setTeamB(e.target.value)} placeholder="Team B" className="bg-[#141310] border border-[#332F26] rounded-sm py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />
            </div>
            <input value={date} onChange={(e)=>setDate(e.target.value)} placeholder="Match date (e.g. Sat 25 July)" className="w-full bg-[#141310] border border-[#332F26] rounded-sm py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#E3A335]" />
            <button type="submit" className="bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] text-xs font-semibold rounded-sm px-4 py-2">+ Add match & generate prediction</button>
          </form>
        )}

        {loading ? <p className="text-sm text-[#6B6355]">Loading…</p> : (
          <div className="space-y-4">
            {predictions.map((p) => (
              <div key={p.id} className="bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4">
                <div className="flex items-center justify-between mb-2">
                  <h3 className="serif text-lg">{p.teamA} vs {p.teamB}</h3>
                  {p.date && <span className="text-xs text-[#6B6355]">{p.date}</span>}
                </div>
                {isAdmin ? (
                  <textarea defaultValue={p.text} onBlur={(e)=>editText(p, e.target.value)} rows="3" className="w-full bg-[#141310] border border-[#332F26] rounded-sm p-2 text-sm text-[#EDE6D6]" />
                ) : (
                  <p className="text-sm text-[#A8A08E]">{p.text}</p>
                )}
                {isAdmin && <button onClick={()=>remove(p)} className="text-xs text-[#C4685A] mt-2">Delete</button>}
              </div>
            ))}
            {predictions.length === 0 && <p className="text-sm text-[#6B6355]">No predictions yet.</p>}
          </div>
        )}
      </main>
    </div>
  );
}

function NovelsPage({ onBack, isAdmin }) {
  const [novels, setNovels] = useState([]);
  const [loading, setLoading] = useState(true);
  const [openNovel, setOpenNovel] = useState(null);
  const [chapterIndex, setChapterIndex] = useState(0);
  const [showAddNovel, setShowAddNovel] = useState(false);
  const [novelTitle, setNovelTitle] = useState("");
  const [chapTitle, setChapTitle] = useState("");
  const [chapBody, setChapBody] = useState("");

  const refresh = useCallback(async () => {
    setLoading(true);
    try { setNovels(await fetchNovels()); } finally { setLoading(false); }
  }, []);
  useEffect(() => { refresh(); }, [refresh]);

  const createNovel = async (e) => {
    e.preventDefault();
    if (!novelTitle) return;
    const novel = { id: `${Date.now()}_${Math.random().toString(36).slice(2,8)}`, title: novelTitle, chapters: [], createdAt: Date.now() };
    await saveNovel(novel);
    setNovelTitle(""); setShowAddNovel(false);
    refresh();
  };

  const addChapter = async (e) => {
    e.preventDefault();
    if (!chapTitle || !chapBody || !openNovel) return;
    const updated = { ...openNovel, chapters: [...openNovel.chapters, { title: chapTitle, body: chapBody }] };
    await saveNovel(updated);
    setChapTitle(""); setChapBody("");
    setOpenNovel(updated);
    refresh();
  };

  const removeNovel = async (novel) => { await deleteNovel(novel); setOpenNovel(null); refresh(); };

  if (openNovel) {
    const chapter = openNovel.chapters[chapterIndex];
    return (
      <div className="min-h-screen bg-[#141310] text-[#EDE6D6]">
        <header className="border-b border-[#2A271F] px-6 py-4 flex items-center justify-between">
          <span className="serif text-lg">{openNovel.title}</span>
          <button onClick={()=>setOpenNovel(null)} className="text-xs text-[#6B6355] hover:text-[#E3A335]">← All novels</button>
        </header>
        <main className="max-w-2xl mx-auto px-6 py-8">
          {openNovel.chapters.length === 0 && <p className="text-sm text-[#6B6355]">No chapters yet.</p>}
          {chapter && (
            <>
              <h2 className="serif text-2xl mb-4">Chapter {chapterIndex + 1}: {chapter.title}</h2>
              <p className="text-sm text-[#EDE6D6] whitespace-pre-wrap leading-relaxed mb-8">{chapter.body}</p>
              <div className="flex justify-between">
                <button disabled={chapterIndex===0} onClick={()=>setChapterIndex(i=>i-1)} className="text-xs disabled:opacity-30 text-[#E3A335]">← Previous</button>
                <button disabled={chapterIndex>=openNovel.chapters.length-1} onClick={()=>setChapterIndex(i=>i+1)} className="text-xs disabled:opacity-30 text-[#E3A335]">Next →</button>
              </div>
            </>
          )}
          {isAdmin && (
            <form onSubmit={addChapter} className="mt-10 bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4 space-y-3">
              <h4 className="text-xs text-[#A8A08E] uppercase tracking-widest">Add new chapter</h4>
              <input value={chapTitle} onChange={(e)=>setChapTitle(e.target.value)} placeholder="Chapter title" className="w-full bg-[#141310] border border-[#332F26] rounded-sm py-2 px-3 text-sm" />
              <textarea value={chapBody} onChange={(e)=>setChapBody(e.target.value)} placeholder="Chapter text..." rows="6" className="w-full bg-[#141310] border border-[#332F26] rounded-sm py-2 px-3 text-sm" />
              <button type="submit" className="bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] text-xs font-semibold rounded-sm px-4 py-2">+ Add chapter</button>
              <button type="button" onClick={()=>removeNovel(openNovel)} className="text-xs text-[#C4685A] block">Delete this novel</button>
            </form>
          )}
        </main>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-[#141310] text-[#EDE6D6]">
      <header className="border-b border-[#2A271F] px-6 py-4 flex items-center justify-between">
        <span className="display text-lg text-[#E3A335]">📖 NOVELS</span>
        <button onClick={onBack} className="text-xs text-[#6B6355] hover:text-[#E3A335]">← Back to site</button>
      </header>
      <main className="max-w-2xl mx-auto px-6 py-8">
        {isAdmin && (
          <button onClick={()=>setShowAddNovel(true)} className="bg-[#E3A335] hover:bg-[#f0b14a] text-[#141310] text-xs font-semibold rounded-sm px-4 py-2 mb-6">+ New novel</button>
        )}
        {showAddNovel && (
          <form onSubmit={createNovel} className="bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4 mb-6 flex gap-2">
            <input value={novelTitle} onChange={(e)=>setNovelTitle(e.target.value)} placeholder="Novel title" className="flex-1 bg-[#141310] border border-[#332F26] rounded-sm py-2 px-3 text-sm" />
            <button type="submit" className="bg-[#E3A335] text-[#141310] text-xs font-semibold rounded-sm px-4">Create</button>
          </form>
        )}
        {loading ? <p className="text-sm text-[#6B6355]">Loading…</p> : (
          <div className="space-y-2">
            {novels.map((n) => (
              <button key={n.id} onClick={()=>{setOpenNovel(n); setChapterIndex(0);}} className="w-full text-left bg-[#1D1B16] border border-[#2A271F] rounded-sm p-4 hover:border-[#E3A335]/50">
                <h3 className="serif text-lg">{n.title}</h3>
                <p className="text-xs text-[#6B6355]">{n.chapters.length} chapter{n.chapters.length !== 1 ? "s" : ""}</p>
              </button>
            ))}
            {novels.length === 0 && <p className="text-sm text-[#6B6355]">No novels yet.</p>}
          </div>
        )}
      </main>
    </div>
  );
}

function App() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("site"); // site | gate | dashboard | predictions | novels
  const [unlocked, setUnlocked] = useState(false);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("screeningRoomTheme") || "dark"; } catch (e) { return "dark"; }
  });

  const toggleTheme = () => {
    setTheme((t) => {
      const next = t === "dark" ? "light" : "dark";
      try { localStorage.setItem("screeningRoomTheme", next); } catch (e) {}
      return next;
    });
  };

  const refresh = useCallback(async () => {
    setLoading(true);
    try { setItems(await fetchLibrary()); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { refresh(); }, [refresh]);

  const themeClass = theme === "light" ? "light-theme" : "";

  if (loading) return <div className={`min-h-screen bg-[#141310] flex items-center justify-center text-[#6B6355] text-sm ${themeClass}`}>Loading…</div>;

  return (
    <div className={themeClass}>
      {view === "gate" && <AdminGate onUnlock={()=>{setUnlocked(true); setView("dashboard");}} onBack={()=>setView("site")} />}
      {view === "dashboard" && <AdminDashboard items={items} onBack={()=>setView("site")} onRefresh={refresh} />}
      {view === "predictions" && <PredictionsPage onBack={()=>setView("site")} isAdmin={unlocked} />}
      {view === "novels" && <NovelsPage onBack={()=>setView("site")} isAdmin={unlocked} />}
      {view === "site" && (
        <PublicSite
          items={items}
          onOpenAdmin={()=>setView("gate")}
          theme={theme}
          onToggleTheme={toggleTheme}
          onOpenPredictions={()=>setView("predictions")}
          onOpenNovels={()=>setView("novels")}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
